services:

  # ─── Merkezi Log Sunucusu ────────────────────────────────────────────────────
  seq:
    image: datalust/seq:latest
    container_name: centrallog-seq
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:80"     # Serilog sink yazma portu (Seq API)
      - "5080:80"     # Seq Web UI  →  http://localhost:5080
    networks:
      - centrallog-net
    restart: unless-stopped

  # ─── Distributed Trace Görselleştirme ───────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: centrallog-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # Jaeger UI  →  http://localhost:16686
      - "4317:4317"    # OTLP gRPC  (servisler bu porta yazar)
      - "4318:4318"    # OTLP HTTP  (alternatif)
    networks:
      - centrallog-net
    restart: unless-stopped

  # ─── CentralLogPoc.Api ──────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: src/CentralLogPoc.Api/Dockerfile
    container_name: centrallog-api
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      Services__Gateway:                  "http://gateway:8080"
      Seq__ServerUrl:                     "http://seq:80"
      OpenTelemetry__OtlpEndpoint:        "http://jaeger:4317"
    depends_on:
      - seq
      - jaeger
      - gateway
    networks:
      - centrallog-net
    restart: unless-stopped

  # ─── CentralLogPoc.Gateway ──────────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: src/CentralLogPoc.Gateway/Dockerfile
    container_name: centrallog-gateway
    ports:
      - "5010:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      Services__OrderService:             "http://orderservice:8080"
      Services__InventoryService:         "http://inventoryservice:8080"
      Seq__ServerUrl:                     "http://seq:80"
      OpenTelemetry__OtlpEndpoint:        "http://jaeger:4317"
    depends_on:
      - seq
      - jaeger
      - orderservice
      - inventoryservice
    networks:
      - centrallog-net
    restart: unless-stopped

  # ─── CentralLogPoc.OrderService ─────────────────────────────────────────────
  orderservice:
    build:
      context: .
      dockerfile: src/CentralLogPoc.OrderService/Dockerfile
    container_name: centrallog-orderservice
    ports:
      - "5020:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      Seq__ServerUrl:                     "http://seq:80"
      OpenTelemetry__OtlpEndpoint:        "http://jaeger:4317"
    depends_on:
      - seq
      - jaeger
    networks:
      - centrallog-net
    restart: unless-stopped

  # ─── CentralLogPoc.InventoryService ─────────────────────────────────────────
  inventoryservice:
    build:
      context: .
      dockerfile: src/CentralLogPoc.InventoryService/Dockerfile
    container_name: centrallog-inventoryservice
    ports:
      - "5030:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      Seq__ServerUrl:                     "http://seq:80"
      OpenTelemetry__OtlpEndpoint:        "http://jaeger:4317"
    depends_on:
      - seq
      - jaeger
    networks:
      - centrallog-net
    restart: unless-stopped

networks:
  centrallog-net:
    driver: bridge
